# Builds the image (amd64 + arm64) and publishes it to ghcr.io/<owner>/gridfinity-foundry, tagged
# with the commit's full sha and :latest.
#
# deploy (only in dfox288/gridfinity-foundry): keyless, as dfox288/meisterboard's build-and-deploy.yml: fetches the
# dfox-websites-k8s-deploy GitHub App key from Infisical via GitHub OIDC (repo secrets INFISICAL_IDENTITY_ID,
# INFISICAL_PROJECT_SLUG), mints a 1 h token scoped to the manifests repo and pins the deployment to this commit's image.
name: image
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gridfinity-foundry
  MANIFESTS_REPO: dfox288/tum-cluster-dfox-websites_k8s
  MANIFEST_FILES: gridfinity.dfox.info/gridfinity-deployment.yaml

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "pushed ${{ env.IMAGE }}:${{ github.sha }}@${{ steps.push.outputs.digest }}"

  deploy:
    needs: image
    if: github.repository == 'dfox288/gridfinity-foundry' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # OIDC -> Infisical (GitHub App key)
    steps:
      - name: Fetch creds from Infisical (OIDC, no stored token)
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          domain: https://secrets.tastatur-und-maus.net
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
        # exports GH_APP_ID, GH_APP_PRIVATE_KEY

      - name: Mint short-lived GitHub App token for the manifests repo
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tum-cluster-dfox-websites_k8s

      - name: Pin the deployment to this commit's image
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # a freshly minted, repo-scoped App token sometimes answers "Repository not found" for a few seconds
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${MANIFESTS_REPO}.git" manifests; then break; fi
            if [ "$attempt" = 5 ]; then echo "[deploy] clone failed after 5 attempts"; exit 1; fi
            echo "[deploy] clone attempt ${attempt} failed, retrying in 10s"; rm -rf manifests; sleep 10
          done
          cd manifests
          for file in $MANIFEST_FILES; do
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|g" "$file"
          done
          git config user.email "gridfinity-foundry-deploy-bot@users.noreply.github.com"
          git config user.name  "gridfinity-foundry-deploy-bot"
          git add --all
          if git diff --cached --quiet; then echo "[deploy] manifest already at ${GITHUB_SHA}"; exit 0; fi
          git commit -m "deploy ${IMAGE}:${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then break; fi
            if [ "$attempt" = 5 ]; then echo "[deploy] push failed after 5 attempts"; exit 1; fi
            echo "[deploy] push attempt ${attempt} failed, retrying in 10s"; sleep 10
          done
